<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W11 故事抽籤 小抄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{ --ink:#F1ECF7; --muted:#A79FC0; --primary:#B8AEE0; --accent:#F08EA3; --gold:#F6B94E; --bg:#16121F; --card:#231D30; --line:#3A3250; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:100%;gap:12px;padding:12px}
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted)}
.top b{color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums}
.top .clock{margin-left:auto;font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
.top button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.notes{background:var(--card);border-radius:14px;padding:22px 26px;overflow:auto}
.notes h2{font-family:"Noto Serif TC",serif;color:var(--primary);margin:0 0 10px;font-size:22px}
.notes pre{white-space:pre-wrap;font:19px/1.75 inherit;margin:0}
.side{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
.next{background:var(--card);border-radius:14px;padding:14px 16px}
.next .lab{font-size:12px;color:var(--muted);letter-spacing:.1em}
.next .t{font-size:18px;margin-top:4px}
.list{background:var(--card);border-radius:14px;padding:8px;overflow:auto}
.list a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.list a.on{background:var(--bg);color:var(--gold);font-weight:700}
.list a span{color:var(--muted);font-variant-numeric:tabular-nums;display:inline-block;width:26px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="prev">◀</button><b id="pos">1 / 1</b><button id="next">▶</button>
    <span id="title"></span>
    <button id="timer">計時 00:00</button>
    <span class="clock" id="clock"></span>
  </div>
  <div class="notes"><h2 id="h"></h2><pre id="n"></pre>
    <div class="links"><a href="index.html" target="_blank" rel="noopener">開投影視窗</a><a href="../board.html" target="_blank" rel="noopener">投影板</a><a href="../admin.html" target="_blank" rel="noopener">老師後台</a></div>
  </div>
  <div class="side">
    <div class="next"><div class="lab">下一頁</div><div class="t" id="nx"></div></div>
    <div class="list" id="list"></div>
  </div>
</div>
<script src="deck.js"></script>
<script>
const S=window.DECK.slides; let cur=0;
const ch=("BroadcastChannel" in window)?new BroadcastChannel("storydeck"):null;
const strip=s=>String(s||"").replace(/<[^>]+>/g,"");
function title(s){ return strip(s.title); }
function show(i,silent){
  i=Math.max(0,Math.min(S.length-1,i)); cur=i; const s=S[i];
  document.getElementById("pos").textContent=`${i+1} / ${S.length}`;
  document.getElementById("h").textContent=title(s);
  document.getElementById("n").textContent=s.notes||"";
  document.getElementById("nx").textContent=S[i+1]?title(S[i+1]):"（最後一頁）";
  document.querySelectorAll("#list a").forEach(a=>a.classList.toggle("on",+a.dataset.i===i));
  if(!silent){ ch&&ch.postMessage({i}); try{localStorage.setItem("storydeck-i",String(i));}catch(e){} }
}
document.getElementById("list").innerHTML=S.map((s,i)=>`<a href="#" data-i="${i}"><span>${i+1}</span>${title(s)}</a>`).join("");
document.getElementById("list").addEventListener("click",e=>{ const a=e.target.closest("a"); if(a){ e.preventDefault(); show(+a.dataset.i); } });
document.getElementById("prev").onclick=()=>show(cur-1); document.getElementById("next").onclick=()=>show(cur+1);
document.getElementById("title").textContent=window.DECK.title;
document.addEventListener("keydown",e=>{ if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();show(cur+1);} else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();show(cur-1);} });
ch&&(ch.onmessage=e=>{ if(typeof e.data.i==="number"&&e.data.i!==cur) show(e.data.i,true); });
window.addEventListener("storage",e=>{ if(e.key==="storydeck-i"){ const i=+e.newValue; if(i!==cur) show(i,true); } });
let t0=null; const tb=document.getElementById("timer");
tb.onclick=()=>{ t0=t0?null:Date.now(); if(!t0) tb.textContent="計時 00:00"; };
setInterval(()=>{ const d=new Date(); document.getElementById("clock").textContent=d.toTimeString().slice(0,5); if(t0){ const s=Math.floor((Date.now()-t0)/1000); tb.textContent=`計時 ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; } },1000);
let i0=0; try{ i0=parseInt(localStorage.getItem("storydeck-i")||"0",10)||0; }catch(e){} show(i0,true);
</script>
</body>
</html>
